@if (todo) {

<div class="container py-5">

    <!-- Header -->
    <div class="row justify-content-center mb-5">

        <div class="col-lg-7">

            <div class="todo-header text-center">

                <h2 class="text-danger mb-4">
                    To Do Details
                </h2>

                <div class="row">

                    <div class="col-md-6">
                        <h5>
                            <strong>Task Title:</strong><br>
                            {{ todo.title }}
                        </h5>
                    </div>

                    <div class="col-md-6">
                        <h5>
                            <strong>Completed:</strong><br>
                            {{ todo.completed ? 'True' : 'False' }}
                        </h5>
                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- Card -->

    <div class="card shadow-lg border-0">

        <div class="card-body p-4">

            <form
                #form1="ngForm"
                (ngSubmit)="updateTodo()">

                <!-- Title -->

                <div class="row align-items-center mb-4">

                    <label class="col-md-3 fw-bold">
                        Task Title:
                    </label>

                    <div class="col-md-9">

                        <input
                            type="text"
                            class="form-control"
                            name="title"
                            [(ngModel)]="todo.title"
                            required
                            minlength="3"
                            #title="ngModel">

                        @if(title.invalid && title.touched){

                        <div class="text-danger mt-1">

                            Title must contain at least 3 characters.

                        </div>

                        }

                    </div>

                </div>

                <!-- Completed -->

                <div class="row align-items-center mb-4">

                    <label class="col-md-3 fw-bold">
                        Completed:
                    </label>

                    <div class="col-md-9">

                        <div class="form-check">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                id="completed"
                                name="completed"
                                [(ngModel)]="todo.completed">

                            <label
                                class="form-check-label Mark"
                                for="completed">

                                Mark as completed

                            </label>

                        </div>

                    </div>

                </div>

                <!-- Button -->

                <button
                    type="submit"
                    class="btn btn-primary w-100"
                    [disabled]="form1.invalid">

                    Update

                </button>

            </form>

        </div>

    </div>

</div>

}
